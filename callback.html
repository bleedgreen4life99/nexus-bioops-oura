
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS BioOps - Oura Authorization</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 600px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.6;
    }
    button {
      background: #1769aa;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
    }
    #status { margin-top: 18px; }
  </style>
</head>
<body>
  <h1>NEXUS BioOps</h1>
  <h2>Oura Authorization</h2>
  <p id="status">Checking authorization...</p>
  <button id="copy" hidden>Copy Authorization Code</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const status = document.getElementById("status");
    const button = document.getElementById("copy");

    if (error) {
      status.textContent = "Authorization failed: " + error;
    } else if (code) {
      status.textContent = "Authorization successful. Copy your code below.";
      button.hidden = false;

      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(code);
          status.textContent = "Code copied. Return to NEXUS Oura Token.";
        } catch (e) {
          status.textContent = "Copy failed. Try again in Safari.";
        }
      });

      // Remove credentials from the visible browser URL.
      history.replaceState({}, "", window.location.pathname);
    } else {
      status.textContent =
        "No authorization code found. Run NEXUS Oura Auth again.";
    }
  </script>
</body>
</html>
